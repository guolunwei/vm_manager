##############################################################################
# vm_manager 配置模板
#
# 复制为 config.ini 后按你的环境修改（本模板不含任何真实信息）。
# 优先级：环境变量 > .env > config.ini > 代码默认值。
# 完整说明见 README.md「配置」一节。
##############################################################################

# -- 路径 --------------------------------------------------------------------
# 虚拟机根目录：所有新建虚拟机都落在这里，每台一个同名子目录
export BASE_DIR="C:\Users\you\Documents\Virtual Machines"

# vmrun.exe 的完整路径（VMware Workstation 安装目录下），留空则自动探测
# export VMRUN="C:\Program Files (x86)\VMware\VMware Workstation\vmrun.exe"

# 模板虚拟机的 vmx（必须是已经装好 open-vm-tools 并关机的母机）
export SRC_VMX="C:\Users\you\Documents\Virtual Machines\template-ubuntu\template-ubuntu.vmx"
export SNAPSHOT="init"

# -- Guest ------------------------------------------------------------------
# 模板里 Linux 的账号密码，创建后用它会执行 nmcli / hostnamectl
export ROOTPASS="换成模板里 root 的密码"
# 模板里的网卡名，不确定就留空由程序自动探测
export CONNECTION="eth0"

# -- 网络 --------------------------------------------------------------------
# GATEWAY / DNS / NETMASK_PREFIX 都可以留空：
# 首次执行 `manage.py bootstrap` 时会从 VMware 的 vmnetdhcp.conf 里自动推断
# （host-only 默认 VMnet1、NAT 默认 VMnet8），推断不出来才需要手工填。
# export GATEWAY="192.168.47.1"
# export DNS="192.168.47.1"
export NETMASK_PREFIX="24"

# -- 规模默认值 --------------------------------------------------------------
export DEFAULT_CPUS="2"
export DEFAULT_MEMORY_MB="4096"

# -- 运行参数 ----------------------------------------------------------------
# 单个后台任务的最长执行时间（秒）
export JOB_TIMEOUT="1800"
# 等客户机可执行命令的最长时间（秒），首次开机较慢可调大
export TOOLS_WAIT="360"
# worker 心跳间隔 / 超过多久没心跳算掉线（秒）
export WORKER_HEARTBEAT="10"
export WORKER_STALE_AFTER="120"
# 软关机失败后等多久再强制断电（秒）
export SOFT_STOP_GRACE="60"
# 探测 IP 时是否允许扫网段（/24 扫一遍约 1 秒，嫌慢可关掉）
export SCAN_ENABLED="1"
export SCAN_TIMEOUT_MS="500"

# -- noVNC 控制台 -------------------------------------------------------------
# WebSocket 代理监听端口（serve 会自动拉起该代理）
# export VMM_VNC_PROXY_PORT=6080

# -- 任务完成通知 -------------------------------------------------------------
# 任务到达终态时由 worker 推送。默认只在失败时通知（NOTIFY_ON_FAILED=1）。
# 企微群机器人 webhook（群设置 → 群机器人 → 添加）
# export NOTIFY_WECHAT_WEBHOOK="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxxxxx"
# 钉钉群机器人 webhook（需在安全设置里勾选「自定义关键词」，如「任务」）
# export NOTIFY_DINGTALK_WEBHOOK="https://oapi.dingtalk.com/robot/send?access_token=xxxxxxxx"
# 通知收件邮箱（逗号分隔；邮件需要同时配置下面的 SMTP）
# export NOTIFY_EMAIL_TO="ops@example.com"
# export NOTIFY_ON_SUCCESS="0"   # 成功也通知（默认 0，避免刷屏）
# export NOTIFY_ON_CANCELED="0"  # 取消也通知
# -- SMTP（只发邮件用；不配 EMAIL_HOST 则邮件渠道自动跳过，webhook 不受影响）
# export EMAIL_HOST="smtp.example.com"
# export EMAIL_PORT="465"
# export EMAIL_HOST_USER="noreply@example.com"
# export EMAIL_HOST_PASSWORD="app-password"
# export EMAIL_USE_TLS="1"
# export DEFAULT_FROM_EMAIL="noreply@example.com"

# -- 资源趋势采集 -------------------------------------------------------------
# 开启后 worker 定期进 Guest 采样 CPU / 内存（依赖 open-vm-tools，仅 Linux Guest）
# export VMM_METRICS_ENABLED="1"
# 采样间隔（秒），最小 60
# export VMM_METRICS_INTERVAL="300"
# 样本保留天数
# export VMM_METRICS_RETENTION_DAYS="7"

# -- Web ---------------------------------------------------------------------
# 生产环境请改成自己的域名，并用环境变量覆盖 DJANGO_SECRET_KEY
# export DJANGO_ALLOWED_HOSTS="vm.example.com,127.0.0.1"
